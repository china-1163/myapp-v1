name: Build Project UAI Chinese client

on:
  push:
    branches: [main]
    paths:
      - "ProjectUAI-zh/**"
      - ".github/workflows/build-uai-zh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-uai-chinese-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translation repository
        uses: actions/checkout@v4
        with:
          path: overlay
          fetch-depth: 0

      - name: Checkout pinned Project UAI source
        uses: actions/checkout@v4
        with:
          repository: Project-Ptolemy/ProjectUAI
          ref: 468c5efba422d73c1533b75dd14ca30c9413152b
          path: upstream

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Apply Chinese UI source overrides and build
        run: |
          cp -a overlay/ProjectUAI-zh/overrides/. upstream/
          cd upstream
          luajit test/check.lua --native
          luajit tools/bundle.lua --native
          luajit tools/bundle.lua --native --check
          test -s dist/uai.lua
          test -s dist/uai.manifest.json
          luajit -e 'local make = assert(loadfile("src/ui/localization.lua"))(); local locale = make({}); assert(locale.translate("Settings") == "设置"); assert(locale.translate("New conversation") == "新建对话"); assert(locale.translate([[return "Hello"]]) == [[return "Hello"]]); print("Chinese UI localization checks passed")'
          luajit test/run.lua --native "every panel builds cleanly" "the built interface holds its layout invariants" "every settings pane builds and is reachable"
          mkdir -p ../overlay/dist
          cp dist/uai.lua ../overlay/UAI_ProjectUAI_Chinese.lua
          cp dist/uai.manifest.json ../overlay/dist/UAI_ProjectUAI_Chinese.manifest.json

      - name: Publish generated executor file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd overlay
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UAI_ProjectUAI_Chinese.lua dist/UAI_ProjectUAI_Chinese.manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Build Chinese Project UAI executor client"
            git push origin "HEAD:main"
          fi
